<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 300px; margin: 12px; }
    button { width: 100%; padding: 9px; font-size: 14px; cursor: pointer; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin: 4px 0 10px; }
    #status { margin-top: 10px; min-height: 2.4em; }
    .ok { color: #1a7f37; } .error { color: #b3261e; }
    small { color: #555; }
  </style>
</head>
<body>
  <button id="save">Enregistrer cette offre</button>
  <div id="status" role="status"></div>
  <small>Astuce : si la description n'est pas détectée, sélectionne son texte avant de cliquer.</small>
  <hr>
  <label>Jeton (affiché dans l'app)<input id="token" type="password" autocomplete="off"></label>
  <script src="popup.js"></script>
</body>
</html>
