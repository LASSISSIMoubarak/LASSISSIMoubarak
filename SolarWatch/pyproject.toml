[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarwatch"
version = "0.1.0"
description = "Surveillance de performance d'onduleurs photovoltaïques"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
deep-learning = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
